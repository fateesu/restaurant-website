<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu - Bella Italia</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f8f5f0;
        }

        header {
            background: #8B0000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .menu {
            padding: 30px;
        }

        .category {
            margin-bottom: 30px;
        }

        .category h2 {
            border-bottom: 2px solid #8B0000;
            padding-bottom: 5px;
            color: #8B0000;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .price {
            font-weight: bold;
            color: #228B22;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>🍝 Bella Italia Menu</h1>
</header>

<div class="menu">

    <div class="category">
        <h2>Pizzas 🍕</h2>
        <div class="item">
            <span>Margherita</span>
            <span class="price">50 MAD</span>
        </div>
        <div class="item">
            <span>4 Fromages</span>
            <span class="price">70 MAD</span>
        </div>
        <div class="item">
            <span>Pizza Poulet</span>
            <span class="price">65 MAD</span>
        </div>
    </div>

    <div class="category">
        <h2>Pasta 🍝</h2>
        <div class="item">
            <span>Spaghetti Carbonara</span>
            <span class="price">60 MAD</span>
        </div>
        <div class="item">
            <span>Lasagna</span>
            <span class="price">75 MAD</span>
        </div>
    </div>

    <div class="category">
        <h2>Desserts 🍰</h2>
        <div class="item">
            <span>Tiramisu</span>
            <span class="price">40 MAD</span>
        </div>
        <div class="item">
            <span>Panna Cotta</span>
            <span class="price">35 MAD</span>
        </div>
    </div>

</div>
<nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="#contact">Contact</a>
</nav>

<footer>
    <p>© 2026 Bella Italia</p>
</footer>

</body>
</html>
